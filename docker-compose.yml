name: aws-lab

services:
  localstack:
    image: localstack/localstack:4.14.0
    container_name: aws-lab-localstack
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: lambda,dynamodb,sqs,apigateway,iam,sts,logs
      DEBUG: "0"
      LAMBDA_DOCKER_NETWORK: aws-lab_default
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
